name: Build local image to GHCR

on:
    push:
        branches: [local-patches]
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
            id-token: write
        steps:
            - name: Checkout source
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Compute lowercase repo owner
              id: repo
              run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

            - name: Build and push amd64 image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ghcr.io/${{ steps.repo.outputs.owner }}/reaparr:local-latest
                      ghcr.io/${{ steps.repo.outputs.owner }}/reaparr:local-${{ github.sha }}
                  build-args: |
                      VERSION=0.38.0-dev-local
                      INFORMATIONAL_VERSION=0.38.0-dev-local+${{ github.sha }}
                      BUILDPLATFORM=linux/amd64
                      TARGETPLATFORM=linux/amd64
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
